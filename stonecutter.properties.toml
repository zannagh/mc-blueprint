# Global properties — identity shared across every loader/version variant.
maven_group = "com.example.examplemod"
archives_base_name = "example-mod"
loader_version = "0.18.4"

# ──────────────────────────────────────────────────────────────────────────────
# Per MC version — shared between fabric and neoforge for the same game version.
# Matched via the version tag registered in multiloader-common.gradle.kts.
# ──────────────────────────────────────────────────────────────────────────────

["1.21.11"]
java.version = "21"
display_version = "mc-1.21.11"

# ──────────────────────────────────────────────────────────────────────────────
# Per project — loader-specific properties.
# Matched via the default project tag (e.g. "fabric-1.21.11").
#
# IMPORTANT: fabric.* and neoforge.* keys MUST be quoted ("fabric.xxx") to
# prevent the branch tag from stripping the first segment during path cutting.
# ──────────────────────────────────────────────────────────────────────────────

["fabric-1.21.11"]
"fabric.minecraft_version" = "1.21.11"
"fabric.minecraft_version_range" = "1.21.11"

["neoforge-1.21.11"]
"neoforge.version" = "21.11.44"
"neoforge.minecraft_version_range" = "[1.21.11]"
