name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.yml'
  schedule:
    - cron: '16 20 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # build-mode: none extracts straight from source - no compiler, no Gradle - which is
      # the cheap option for a Java mod whose only Kotlin is buildSrc Gradle logic. If you
      # add shipped Kotlin sources you want scanned, switch to a traced build (drop
      # build-mode and add a Gradle compile step) so kotlinc gets traced.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality adds the maintainability/quality query family on top of the
          # security-only default. Quality queries work fully on source, so they pair well
          # with build-mode: none.
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
