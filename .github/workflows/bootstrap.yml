# One-shot template bootstrap.
#
# When you create a repository from this template, the first push to the default
# branch triggers this workflow. It derives your mod's names from the new
# repository name + owner, runs adjust-names.sh, commits the result, and then
# disappears (adjust-names.sh deletes itself and this workflow on success).
#
# This is the closest thing to "template variables" GitHub offers: the repo name
# IS the variable. Prefer running ./adjust-names.sh locally if you want a display
# name the repo name can't express, or a custom package/group.
name: Template bootstrap

on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: template-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    # Skip on the template repo itself, and only run while the template is still
    # un-initialized (adjust-names.sh present) on the default branch.
    if: >-
      github.repository != 'zannagh/mc-blueprint' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Bail out if already initialized
        id: guard
        run: |
          if [ ! -f ./adjust-names.sh ]; then
            echo "adjust-names.sh not present — template already initialized. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive names and rewrite
        if: steps.guard.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "Initializing template as '$REPO_NAME' for owner '$OWNER'."
          bash ./adjust-names.sh --name "$REPO_NAME" --owner "$OWNER" --repo "$REPO_NAME" -y

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: initialize mod from template (${{ github.event.repository.name }})"
            git push
          fi
