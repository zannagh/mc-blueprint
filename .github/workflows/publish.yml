# Build & Publish
# =============================================================================
# Publishes the Fabric + NeoForge jars to the mod distribution platforms.
#
# DORMANT BY DEFAULT: this workflow only runs on a published GitHub Release or a
# manual dispatch, and every external-publish job is gated on configuration being
# present. With nothing configured it builds the jars, attaches them to the
# release, prints exactly which secrets/vars to set, and exits cleanly WITHOUT
# publishing anything anywhere.
#
# Configure in the repo's Settings to enable a platform (each is independent -
# enable only the ones you use):
#
#   Modrinth   -> secret MODRINTH_TOKEN     + variable MODRINTH_PROJECT_ID
#   CurseForge -> secret CURSEFORGE_TOKEN   + variable CURSEFORGE_PROJECT_ID
#
# Optional variables (sensible defaults for the shipped 1.21.11 template):
#   GAME_VERSIONS    Minecraft versions to tag, newline- or space-separated.  Default: 1.21.11
#   DISPLAY_VERSION  The "+<display>" segment in the jar names.               Default: mc-1.21.11
#   ARCHIVES_BASE    stonecutter archives_base_name.                          Default: example-mod
#
# Secrets are set under Settings > Secrets and variables > Actions > Secrets;
# variables under the neighbouring Variables tab.
# =============================================================================
name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and resolve metadata but do not upload to any platform.'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # PREFLIGHT - decide which platforms are configured (secrets can't be read in
  # a job-level `if:`, so this is resolved in a step and exposed as outputs).
  # ===========================================================================
  check-config:
    name: Check publish configuration
    runs-on: ubuntu-latest
    outputs:
      modrinth: ${{ steps.cfg.outputs.modrinth }}
      curseforge: ${{ steps.cfg.outputs.curseforge }}
    steps:
      - name: Resolve configuration
        id: cfg
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          MODRINTH=false
          CURSEFORGE=false
          if [[ -n "$MODRINTH_TOKEN" && -n "$MODRINTH_PROJECT_ID" ]]; then MODRINTH=true; fi
          if [[ -n "$CURSEFORGE_TOKEN" && -n "$CURSEFORGE_PROJECT_ID" ]]; then CURSEFORGE=true; fi

          echo "modrinth=$MODRINTH" >> "$GITHUB_OUTPUT"
          echo "curseforge=$CURSEFORGE" >> "$GITHUB_OUTPUT"

          {
            echo "## Publish configuration"
            echo ""
            echo "| Platform | Configured | Needs |"
            echo "| --- | --- | --- |"
            echo "| Modrinth | $MODRINTH | secret \`MODRINTH_TOKEN\` + var \`MODRINTH_PROJECT_ID\` |"
            echo "| CurseForge | $CURSEFORGE | secret \`CURSEFORGE_TOKEN\` + var \`CURSEFORGE_PROJECT_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$MODRINTH" != "true" && "$CURSEFORGE" != "true" ]]; then
            echo "::notice::No publish platform is configured. The jars will be built (and attached to the release, if this is a release) but nothing will be published. Set MODRINTH_TOKEN + MODRINTH_PROJECT_ID and/or CURSEFORGE_TOKEN + CURSEFORGE_PROJECT_ID in the repo settings to enable publishing."
          else
            [[ "$MODRINTH" == "true" ]] && echo "::notice::Modrinth publishing is configured."
            [[ "$CURSEFORGE" == "true" ]] && echo "::notice::CurseForge publishing is configured."
          fi

  # ===========================================================================
  # BUILD - always runs; produces the loader jars and resolves the version.
  # ===========================================================================
  build:
    name: Build
    needs: [check-config]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      display_version: ${{ steps.meta.outputs.display_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: meta
        env:
          DISPLAY_VERSION_VAR: ${{ vars.DISPLAY_VERSION }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          DISPLAY_VERSION="${DISPLAY_VERSION_VAR:-mc-1.21.11}"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            MOD_VERSION="${RELEASE_TAG#v}"
            IS_PRERELEASE="${RELEASE_PRERELEASE}"
          else
            # Manual dispatch: a non-publishable dev version, always marked prerelease.
            MOD_VERSION="0.0.0-dispatch.${GITHUB_SHA::7}"
            IS_PRERELEASE="true"
          fi
          [[ -z "$MOD_VERSION" ]] && MOD_VERSION="0.0.0"

          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $MOD_VERSION (prerelease: $IS_PRERELEASE, display: $DISPLAY_VERSION)"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload loader jars
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            fabric/versions/**/build/libs/*.jar
            neoforge/versions/**/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error

  # ===========================================================================
  # ATTACH TO GITHUB RELEASE - only on a real release; uses the built-in token,
  # so it needs no external configuration and never publishes off-site.
  # ===========================================================================
  attach-to-release:
    name: Attach jars to GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*.jar

  # ===========================================================================
  # PUBLISH TO MODRINTH - gated on Modrinth being configured.
  # ===========================================================================
  publish-modrinth:
    name: Publish to Modrinth (${{ matrix.loader }})
    needs: [check-config, build]
    runs-on: ubuntu-latest
    if: needs.check-config.outputs.modrinth == 'true' && !inputs.dry_run
    strategy:
      fail-fast: false
      # Serialize: parallel jobs hammer Modrinth's tag API and can get rate-limited (429),
      # which silently yields empty loaders/game_versions metadata on the published version.
      max-parallel: 1
      matrix:
        loader: [fabric, neoforge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          archives-base-name: ${{ vars.ARCHIVES_BASE || 'example-mod' }}
          display-version: ${{ needs.build.outputs.display_version }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to Modrinth
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ vars.GAME_VERSIONS || '1.21.11' }}
          game-version-filter: any
          changelog: ${{ github.event.release.body }}
          modrinth-featured: false
          retry-attempts: 2
          retry-delay: 10000

  # ===========================================================================
  # PUBLISH TO CURSEFORGE - gated on CurseForge being configured.
  # ===========================================================================
  publish-curseforge:
    name: Publish to CurseForge (${{ matrix.loader }})
    needs: [check-config, build]
    runs-on: ubuntu-latest
    if: needs.check-config.outputs.curseforge == 'true' && !inputs.dry_run
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        loader: [fabric, neoforge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          archives-base-name: ${{ vars.ARCHIVES_BASE || 'example-mod' }}
          display-version: ${{ needs.build.outputs.display_version }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to CurseForge
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ vars.GAME_VERSIONS || '1.21.11' }}
          game-version-filter: any
          changelog: ${{ github.event.release.body }}
          retry-attempts: 2
          retry-delay: 10000
          # Warn (don't fail) when CurseForge lacks a game version yet, e.g. a brand-new
          # snapshot CF hasn't added. Re-run once CF catches up.
          curseforge-fail-mode: warn
