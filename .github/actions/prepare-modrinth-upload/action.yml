name: Prepare Mod Upload
description: >
  Locates the built loader JAR for a given Minecraft display-version/loader and derives the
  version number, display name and version type used when publishing to Modrinth/CurseForge.

inputs:
  archives-base-name:
    description: The archives base name the jars are built under (stonecutter archives_base_name).
    required: false
    default: example-mod
  display-version:
    description: Display version string used in the jar name (e.g. "mc-1.21.11").
    required: true
  mod-version:
    description: The mod version string (e.g. 1.0.0 or 1.0.0-pre.1).
    required: true
  is-prerelease:
    description: Whether this is a prerelease build ("true"/"false").
    required: true
  artifact-path:
    description: Directory containing the downloaded/built jars to search.
    required: true
  loader:
    description: The mod loader (fabric or neoforge).
    required: true

outputs:
  found:
    description: Whether a JAR was found for this loader/display-version.
    value: ${{ steps.find-jar.outputs.found }}
  jar_path:
    description: Path to the found JAR file.
    value: ${{ steps.find-jar.outputs.path }}
  version_number:
    description: The publish version number (e.g. fab-mc-1.21.11-1.0.0).
    value: ${{ steps.info.outputs.version_number }}
  version_name:
    description: The publish display name (e.g. "[Fabric] mc-1.21.11 - 1.0.0").
    value: ${{ steps.info.outputs.version_name }}
  version_type:
    description: The publish version type (release or beta).
    value: ${{ steps.info.outputs.version_type }}

runs:
  using: composite
  steps:
    - name: Find JAR
      id: find-jar
      shell: bash
      run: |
        BASE="${{ inputs.archives-base-name }}"
        LOADER="${{ inputs.loader }}"
        DISPLAY="${{ inputs.display-version }}"
        JAR=$(find "${{ inputs.artifact-path }}" -name "${BASE}-${LOADER}-*+${DISPLAY}.jar" ! -name "*-sources.jar" 2>/dev/null | head -n1)
        if [[ -z "$JAR" ]]; then
          echo "No JAR found for ${LOADER} ${DISPLAY}"
          echo "found=false" >> "$GITHUB_OUTPUT"
        else
          echo "Found JAR: $JAR"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare version info
      if: steps.find-jar.outputs.found == 'true'
      id: info
      shell: bash
      run: |
        DISPLAY_VERSION="${{ inputs.display-version }}"
        MOD_VERSION="${{ inputs.mod-version }}"
        IS_PRERELEASE="${{ inputs.is-prerelease }}"
        LOADER="${{ inputs.loader }}"

        # Short loader prefix keeps the version string compact.
        case "$LOADER" in
          fabric)   SHORT_LOADER="fab" ;;
          neoforge) SHORT_LOADER="neo" ;;
          *)        SHORT_LOADER="$LOADER" ;;
        esac

        VERSION_NUMBER="${SHORT_LOADER}-${DISPLAY_VERSION}-${MOD_VERSION}"
        VERSION_NAME="[${LOADER^}] ${DISPLAY_VERSION} - ${MOD_VERSION}"

        if [[ "$IS_PRERELEASE" == "true" ]]; then
          VERSION_TYPE="beta"
        else
          VERSION_TYPE="release"
        fi

        echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
